[package]
"name" = "app-services"
"version" = "0.1.0"
"edition" = "2024"
"autotests" = false
"autobenches" = false

[dependencies]
"async-trait" = "0.1"
"domain" = { "path" = "../domain" }
"provider-api" = { "path" = "../provider-api" }
"analysis-api" = { "path" = "../analysis-api" }
"data-hub" = { "path" = "../data-hub" }
"serde" = { "version" = "1", "features" = ["derive"] }
"strategy-api" = { "path" = "../strategy-api" }
"strategy-engine" = { "path" = "../strategy-engine" }
"futures" = "0.3"
"tokio" = { "version" = "1", "features" = ["time", "macros"] }

[dev-dependencies]
strategy-range = { path = "../strategy-range" }
tokio = { version = "1", features = ["rt", "macros"] }
plugin-api = { path = "../plugin-api" }
analyzer-volume = { path = "../analyzer-volume" }
