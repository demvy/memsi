[package]
"name" = "provider-api"
"version" = "0.1.0"
"edition" = "2024"
"autotests" = false
"autobenches" = false

[dependencies]
tokio-util = { version = "0.7", features = ["rt"] }
"domain" = { "path" = "../domain" }
"serde" = { "version" = "1", "features" = ["derive"] }
"thiserror" = "2"
"async-trait" = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
