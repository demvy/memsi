[package]
"name" = "app-cli"
"version" = "0.1.0"
"edition" = "2024"
"autobins" = false
"autotests" = false
"autobenches" = false

[features]
"monitor" = ["dep:strategy-api", "dep:state-api", "dep:app-services", "dep:domain", "dep:provider-api", "dep:tokio", "dep:monitor-runtime", "dep:signal-service"]
"default" = ["codex", "console", "high-risk", "low-risk", "monitor", "range", "telegram", "trend", "volume"]
"console" = ["app-bootstrap/console"]
"telegram" = ["app-bootstrap/telegram"]
"low-risk" = ["app-bootstrap/low-risk"]
"high-risk" = ["app-bootstrap/high-risk"]
"codex" = ["monitor", "app-bootstrap/codex", "dep:app-services", "dep:domain", "dep:provider-api", "dep:tokio", "dep:monitor-runtime", "dep:signal-service"]
"range" = ["app-bootstrap/range"]
"volume" = ["app-bootstrap/volume"]
"trend" = ["app-bootstrap/trend"]

[dependencies]
"strategy-api" = { "path" = "../strategy-api", "optional" = true }
"time" = { "version" = "0.3.44", "features" = ["formatting"] }
"app-api" = { "path" = "../app-api" }
"app-bootstrap" = { "path" = "../app-bootstrap", "default-features" = false }
"app-config" = { "path" = "../app-config" }
"serde_json" = "1"
"clap" = { "version" = "4", "features" = ["derive"] }
"app-services" = { "path" = "../app-services", "optional" = true }
"domain" = { "path" = "../domain", "optional" = true }
"provider-api" = { "path" = "../provider-api", "optional" = true }
"tokio" = { "version" = "1", "features" = ["rt", "time", "macros", "signal"], "optional" = true }
"monitor-runtime" = { "path" = "../monitor-runtime", "optional" = true }
"signal-service" = { "path" = "../signal-service", "optional" = true }
"serde" = { "version" = "1", "features" = ["derive"], "optional" = true }
"toml" = { "version" = "1.1", "optional" = true }
"state-api" = { "path" = "../state-api", "optional" = true }


[dev-dependencies]
async-trait = "0.1"
